<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;1,300&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/estabelecimento.css">
    <title>LocalTop</title>
</head>

<body style="background-color: #F7EFE6; display: flex; flex-direction: column;">

    <!-- Header -->
    <header>
        <a href="/" class="logoLink">
            <img src="../imagens/logo/SVG Variações/Branco/Horizontal-Branco-changed.svg" alt="Logo LocalTop"
                class="logo">
        </a>
        <nav class="servicos">
            <a href="/" class="encontrar">Encontrar <p>LocalTop</p></a>
            <a href="/">Divulgar Serviço</a>
            <a href="/#sobre">Sobre Nós</a>
        </nav>
        <nav class="infos">
            <h3 id="nomeUsu">Nome Usuário </h3>
            <div class="usuario">
                <button class="dropdownUsuario" id="BtnDropdown" onclick="dropdown()">
                    <img src="../imagens/SVGs/perfil.svg" alt="Minha Conta" class="conta">
                </button>
                <div class="dropdown-content">
                    <a href="/perfil">Meu Perfil</a>
                    <button id="logoutBtn">Sair</button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main class="container my-5" style="display: flex; flex-direction: column; align-items: center; justify-content: space-between;">
        <button style="align-self: self-start;"><a href="/pesquisa" style="color: white; text-decoration: none;">Voltar</a></button>

        <div class="row" style="box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);">
            <!-- Carrossel -->
            <div class="col-md-6 mb-4" style="display: flex; align-items: center;">
                <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active" data-bs-interval="10000">
                            <img src="../imagens/fachada-do-estabelecimento.jpg" class="d-block w-100 rounded"
                                alt="Fachada" style="height: 300px; object-fit: cover;">
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Anterior</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Próximo</span>
                    </button>
                </div>
            </div>

            <!-- Informações -->
            <div class="col-md-6">
                <h2 class="fw-bold" id="nome">Nome do Estabelecimento</h2>

                <h4 class="mt-3">Avaliações:</h4>
                <div class="rating mb-3">
                    <input type="radio" id="estrela5" name="avaliacao" value="5" />
                    <label for="estrela5">★</label>
                    <input type="radio" id="estrela4" name="avaliacao" value="4" />
                    <label for="estrela4">★</label>
                    <input type="radio" id="estrela3" name="avaliacao" value="3" />
                    <label for="estrela3">★</label>
                    <input type="radio" id="estrela2" name="avaliacao" value="2" />
                    <label for="estrela2">★</label>
                    <input type="radio" id="estrela1" name="avaliacao" value="1" />
                    <label for="estrela1">★</label>
                </div>

                <h5>Descrição:</h5>
                <p class="text-muted">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>

                <h5>Tipo de serviços:</h5>
                <button class="btn btn-outline-secondary btn-sm me-2">Restaurante</button>
                <button class="btn btn-outline-secondary btn-sm">Marmitaria</button>

                <h5 class="mt-3">Contato:</h5>
                <p id="contato">(41) 99999-9999</p>

                <h5>Horário de atendimento:</h5>
                <p>Seg a Sex - 08h às 18h</p>
            </div>
        </div>

        <!-- Formulário de Avaliação -->
        <form id="formAvaliacao" class="mt-3">
            <div id="avaliacoes" class="mt-4">
                <h2>Avaliações:</h2>
            </div>
            <label>Avaliação:</label>
            <div class="rating mb-3">
                <input type="radio" id="estrela5form" name="avaliacao" value="5" />
                <label for="estrela5form">★</label>
                <input type="radio" id="estrela4form" name="avaliacao" value="4" />
                <label for="estrela4form">★</label>
                <input type="radio" id="estrela3form" name="avaliacao" value="3" />
                <label for="estrela3form">★</label>
                <input type="radio" id="estrela2form" name="avaliacao" value="2" />
                <label for="estrela2form">★</label>
                <input type="radio" id="estrela1form" name="avaliacao" value="1" />
                <label for="estrela1form">★</label>
            </div>

            <label for="comentario">Comentário:</label>
            <textarea id="comentario" name="comentario" required></textarea>

            <button type="submit">Enviar avaliação</button>
        </form>

        <!-- Container que estava faltando -->
        <div id="grade-produtos" class="row mt-5">
            <!-- Cards dos estabelecimentos aparecerão aqui -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="/scripts/estabelecimento.js"></script>

    <script>
        const form = document.getElementById('formAvaliacao');
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            SubmitComentario(); 
        });
        // Dropdown
        function dropdown() {
            const dropdown = document.querySelector(`.dropdown-content`);
            dropdown.style.display === "flex" ? dropdown.style.display = "none" : dropdown.style.display = "flex";
        };

        // Escuta seleção de estrelas
        const estrelas = document.querySelectorAll('input[name="avaliacao"]');
        estrelas.forEach((estrela) => {
            estrela.addEventListener('change', () => {
                console.log('Nota selecionada:', estrela.value);
            });
        });


    </script>
    <script>
        let podeVerificar = true;
    
        // Verifica o estado de login e, se estiver logado, ativa o monitoramento de sessão
        const inicializarVerificacaoDeSessao = async () => {
          try {
            const infos = document.getElementById("infos");
            const resposta = await fetch("/auth/estado");
            const dados = await resposta.json();
            if (!dados.logado) {
              infos.innerHTML = `<a href="/login" class="logar">Login</a><a href="/signup" class="cadastrar">Cadastrar-se</a>`
            }
            if (dados.logado) {
              if (dados.adm) {
                infos.innerHTML = `<h3 id="nomeUsu">Nome Usuário </h3>
                <div class="usuario">
                  <button class="dropdownUsuario" id="BtnDropdown" onclick="dropdown()">
                    <img src="../imagens/SVGs/perfil.svg" alt="Minha Conta" class="conta">
                  </button>
                  <div class="dropdown-content">
                    <a href="/perfil">Meu Perfil</a>
                    <a href="/listaUsuarios">Usuários</a>
                    <a href="/listaLojas">Estabelecimentos</a>
                    <button id="logoutBtn" onclick="logout()">Sair</button>
                  </div>
                </div>`
              } else {
                infos.innerHTML = `<h3 id="nomeUsu">Nome Usuário </h3>
                <div class="usuario">
                  <button class="dropdownUsuario" id="BtnDropdown" onclick="dropdown()">
                    <img src="../imagens/SVGs/perfil.svg" alt="Minha Conta" class="conta">
                  </button>
                  <div class="dropdown-content">
                    <a href="/perfil">Meu Perfil</a>
                    <button id="logoutBtn" onclick="logout()">Sair</button>
                  </div>
                </div>`
              }
              ativarMonitoramento();
            }
          } catch (err) {
            console.error("Erro ao verificar login inicial:", err);
          }
        };
        const verificarSessao = async () => {
          if (!podeVerificar) return;
          podeVerificar = false;
          try {
            const resposta = await fetch("/auth/estado");
            const dados = await resposta.json();
            if (!dados.logado) {
              Swal.fire({
                icon: 'error',
                title: 'Sua sessão expirou',
                text: 'Aperte OK para ser redirecionado para a tela de login ou espere para ser redirecionado.',
                timer:5000,
                timerProgressBar: true
              }).then((result) => {
                sessionStorage.clear();
                if (result.isConfirmed) {
                  window.location.href = "/login";
                }
                if (result.dismiss === Swal.DismissReason.timer) {
                  window.location.href = "/login";
                }
              })
            }
          } catch (err) {
            console.error("Erro ao verificar sessão:", err);
          }
          setTimeout(() => {
            podeVerificar = true;
          }, 10000); // 10 segundos entre verificações
        };
        const ativarMonitoramento = () => {
          ['click', 'keydown', 'mousemove', 'scroll'].forEach(evento => {
            document.addEventListener(evento, verificarSessao);
          });
        };
        // Inicia tudo ao carregar a página
        inicializarVerificacaoDeSessao();
        async function logout() {
          try {
            const resposta = await fetch("/logout", {
              method: "GET",
            });
            if (resposta.ok) {
              // Quando o logout for bem-sucedido, redireciona para o login ou página inicial
              window.location.href = "/login";
            } else {
              alert("Erro ao fazer logout.");
            }
          } catch (err) {
            console.error("Erro ao fazer logout:", err);
          }
        }
        function dropdown() {
          const dropdown = document.querySelector(`.dropdown-content`);
          dropdown.style.display === "flex" ? dropdown.style.display = "none" : dropdown.style.display = "flex";
        }
        async function pegarDados() {
          try {
            const resposta = await fetch("/auth/estado");
            const dados = await resposta.json();
            const response = await fetch(`/api/usuario/${dados.usuarioId}`, {
              method: 'GET'
            })
            const usuario = await response.json();
            document.getElementById("nomeUsu").innerHTML = `Olá, ${usuario.Nome.split(" ")[0] }`;
            const responseImg = await fetch(`/api/usuario/${dados.usuarioId}/foto`,{
              method: 'GET'
            })
            if (responseImg.status === 202) {
              return;
            }
            else if (responseImg.ok) {
              if (responseImg.status === 204) {
               return;
              }
              // Tem imagem, exibe
              const img = await responseImg.blob();
              document.querySelector(".conta").src = URL.createObjectURL(img);
            } else {
              console.error(`Erro ao carregar imagem. Status: ${responseImg.status}`);
            }
          } catch (error) {
            console.log(`Erro ao requisitar os dados do banco.\n${error}`);
          }
        }
    
        document.addEventListener('DOMContentLoaded', pegarDados())
      </script>
</body>

</html>
